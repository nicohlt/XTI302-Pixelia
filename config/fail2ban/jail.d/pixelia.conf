# Configuration fail2ban Pixelia (J1)

[sshd]
# activer la surveillance de SSH
enabled = true
# lire le journal de journald (pas de /var/log/auth.log sur Debian 13)
backend = systemd
# bannir apres 3 echecs...
maxretry = 3
# ... comptes sur 10 minutes
findtime = 10m
# bannir pendant 10 minutes
bantime = 10m
# bannir avec le pare-feu nftables
banaction = nftables
