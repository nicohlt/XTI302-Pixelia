#!/usr/sbin/nft -f
# Pare-feu Pixelia (J2)
# Tout ce qui entre est refuse, sauf SSH et les connexions deja etablies

# On n'utilise pas "flush ruleset" : ca effacerait aussi les regles de fail2ban.
# On cree la table (si elle n'existe pas), on la supprime, puis on la recree :
# seule notre table est remise a zero.
table inet filtre
delete table inet filtre

table inet filtre {
    chain input {
        # par defaut on jette tout ce qui arrive
        type filter hook input priority 0; policy drop;

        # les reponses aux connexions deja ouvertes
        ct state established,related accept

        # la machine peut se parler a elle-meme (interface lo)
        iif "lo" accept

        # SSH sur le port 22
        tcp dport 22 accept
    }
}
