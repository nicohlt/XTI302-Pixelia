# Configuration SSH Pixelia

# Interdire la connexion SSH de root
PermitRootLogin no

# Autoriser les connexions par cle uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# Autoriser uniquement le groupe acces_ssh
AllowGroups acces_ssh

# Limiter les tentatives de connexion
MaxAuthTries 4

# Controler les connexions inactives
ClientAliveInterval 300
ClientAliveCountMax 3
